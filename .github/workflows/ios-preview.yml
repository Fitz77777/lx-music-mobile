name: iOS Preview

# 手动构建无签名 IPA，用于 iOS UI 改动的侧载验收。
# 不发布 Release、不修改版本号，仅上传构建产物。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支、标签或 commit SHA（留空则使用当前分支）'
        required: false
        default: ''
      retention_days:
        description: 'IPA artifact 保留天数'
        required: false
        default: '7'

permissions:
  contents: read

env:
  NO_FLIPPER: 1
  IOS_SCHEME: LxMusicMobile
  IOS_WORKSPACE: ios/LxMusicMobile.xcworkspace
  IOS_BUNDLE_IDENTIFIER: cn.toside.music.mobile
  DERIVED_DATA_PATH: build/DerivedData

jobs:
  ios-preview:
    name: Unsigned IPA (preview)
    runs-on: macos-15
    concurrency:
      group: ios-preview-${{ github.ref }}-${{ inputs.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          bundle exec pod install --repo-update

      - name: Build unsigned iOS app
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_VERSION_CODE=$(node -p "require('./package.json').versionCode")
          # CFBundleShortVersionString 只允许 1-3 段数字，去掉 -fork.N 后缀
          IOS_MARKETING_VERSION="${PACKAGE_VERSION%%-*}"
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$PACKAGE_VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            NODE_BINARY="$(which node)" \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Show first Xcode errors
        if: failure()
        run: |
          echo "===== Xcode errors ====="
          grep -n -C 3 "error:" build/xcodebuild.log | head -120 || true

      - name: Upload Xcode build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-preview-xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          (
            cd build
            zip -qry "lx-music-mobile-v${PACKAGE_VERSION}-ios-unsigned.ipa" Payload
          )

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-preview-ipa
          path: build/lx-music-mobile-v*-ios-unsigned.ipa
          retention-days: ${{ inputs.retention_days }}
