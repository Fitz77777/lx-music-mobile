name: Build Beta

on:
  push:
    branches:
      - beta

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Packages
        env:
          DISABLE_SVG: 1
          KEYSTORE_B64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_STORE_FILE }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PWD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        shell: bash
        run: |
          cd android
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_FILE" ] && [ -n "$KEYSTORE_ALIAS" ] && [ -n "$KEYSTORE_PWD" ] && [ -n "$KEYSTORE_KEY_PWD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "app/$KEYSTORE_FILE"
            SIGN_OPTS=(-PMYAPP_UPLOAD_STORE_FILE="$KEYSTORE_FILE" -PMYAPP_UPLOAD_KEY_ALIAS="$KEYSTORE_ALIAS" -PMYAPP_UPLOAD_STORE_PASSWORD="$KEYSTORE_PWD" -PMYAPP_UPLOAD_KEY_PASSWORD="$KEYSTORE_KEY_PWD")
            trap 'rm -f "app/$KEYSTORE_FILE"' EXIT
          else
            echo "::warning::未配置签名 secrets (KEYSTORE_*)，使用 debug 签名进行测试构建"
            SIGN_OPTS=(-PMYAPP_UPLOAD_STORE_FILE=debug.keystore -PMYAPP_UPLOAD_KEY_ALIAS=androiddebugkey -PMYAPP_UPLOAD_STORE_PASSWORD=android -PMYAPP_UPLOAD_KEY_PASSWORD=android)
          fi
          ./gradlew assembleRelease "${SIGN_OPTS[@]}"

      # Push tag to GitHub if package.json version's tag is not tagged
      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      - name: Upload Artifact
        uses: ./.github/actions/upload-artifact
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
