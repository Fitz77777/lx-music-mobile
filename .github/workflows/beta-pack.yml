name: Build Beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Packages
        env:
          DISABLE_SVG: 1
          KEYSTORE_B64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_STORE_FILE }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PWD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        shell: bash
        run: |
          cd android
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_FILE" ] && [ -n "$KEYSTORE_ALIAS" ] && [ -n "$KEYSTORE_PWD" ] && [ -n "$KEYSTORE_KEY_PWD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "app/$KEYSTORE_FILE"
            SIGN_OPTS=(-PMYAPP_UPLOAD_STORE_FILE="$KEYSTORE_FILE" -PMYAPP_UPLOAD_KEY_ALIAS="$KEYSTORE_ALIAS" -PMYAPP_UPLOAD_STORE_PASSWORD="$KEYSTORE_PWD" -PMYAPP_UPLOAD_KEY_PASSWORD="$KEYSTORE_KEY_PWD")
            trap 'rm -f "app/$KEYSTORE_FILE"' EXIT
          else
            echo "::warning::未配置签名 secrets (KEYSTORE_*)，使用 debug 签名进行测试构建"
            SIGN_OPTS=(-PMYAPP_UPLOAD_STORE_FILE=debug.keystore -PMYAPP_UPLOAD_KEY_ALIAS=androiddebugkey -PMYAPP_UPLOAD_STORE_PASSWORD=android -PMYAPP_UPLOAD_KEY_PASSWORD=android)
          fi
          ./gradlew assembleRelease "${SIGN_OPTS[@]}"

      # Push tag to GitHub if package.json version's tag is not tagged
      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      - name: Upload Artifact
        uses: ./.github/actions/upload-artifact
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

  Ios:
    name: iOS IPA
    runs-on: macos-15
    concurrency:
      group: ios-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      IOS_SCHEME: LxMusicMobile
      IOS_WORKSPACE: ios/LxMusicMobile.xcworkspace
      IOS_BUNDLE_IDENTIFIER: cn.toside.music.mobile
      DERIVED_DATA_PATH: build/DerivedData
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          bundle exec pod install --repo-update

      - name: Build unsigned iOS app
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_VERSION_CODE=$(node -p "require('./package.json').versionCode")
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            MARKETING_VERSION="$PACKAGE_VERSION" \
            CURRENT_PROJECT_VERSION="$PACKAGE_VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            NODE_BINARY="$(which node)" \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Show first Xcode errors
        if: failure()
        run: |
          echo "===== Xcode errors ====="
          grep -n -C 3 "error:" build/xcodebuild.log | head -120 || true

      - name: Upload Xcode build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          (
            cd build
            zip -qry "lx-music-mobile-v${PACKAGE_VERSION}-ios-unsigned.ipa" Payload
          )

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: build/lx-music-mobile-v*-ios-unsigned.ipa
